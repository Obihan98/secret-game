[workspace]
resolver = "3"
members = ["crates/sim", "crates/server", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
